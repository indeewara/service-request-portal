services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      retries: 10

  # S3 stand-in. Pinned: 4.4 community edition runs S3 without a LocalStack account.
  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "service-request-photos"]
      interval: 5s
      retries: 20

  # BullMQ queue for status emails.
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Catches every email the mock provider sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
