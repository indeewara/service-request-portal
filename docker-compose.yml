services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      retries: 10

  # S3 stand-in. Pinned: 4.4 community edition runs S3 without a LocalStack account.
  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "service-request-photos"]
      interval: 5s
      retries: 20

  # BullMQ queue for status emails.
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Catches every email the mock provider sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # Runs migrations and seeds the demo users on start. Swagger: http://localhost:4000/docs
  api:
    build: ./api
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://portal:portal@db:5432/portal
      # Local-only value. Use a long random secret from a secrets manager in any real environment.
      JWT_SECRET: local-dev-secret-change-me
      S3_ENDPOINT: http://localstack:4566
      # The browser can't resolve "localstack", so pre-signed URLs use the host's address.
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_REGION: us-east-1
      S3_BUCKET: service-request-photos
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Service Portal <no-reply@portal.local>
      MOCK_EMAIL_FAILURE_RATE: "0.3"
      NOTIFICATION_BACKOFF_MS: "2000"
      LOG_LEVEL: info
      LOGIN_RATE_LIMIT: "5"
      # Behind the Next.js server.
      TRUST_PROXY_HOPS: "1"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      retries: 20

  # The portal: http://localhost:3000
  web:
    build: ./web
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
